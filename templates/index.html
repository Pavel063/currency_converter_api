<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Конвертор валют</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f2f4f7;margin:0;padding:40px;color:#222}
    .card{max-width:680px;margin:auto;background:white;padding:30px;border-radius:16px;box-shadow:0 8px 30px #0001}
    h1{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
    label{display:block;font-weight:bold;margin-bottom:6px} input,select,button{width:100%;padding:12px;border:1px solid #ccd1d8;border-radius:8px;box-sizing:border-box}
    button{margin-top:20px;background:#222;color:#fff;cursor:pointer}.result{margin-top:20px;padding:16px;background:#eef6ff;border-radius:10px;font-size:20px}
    .meta{margin-top:10px;font-size:13px;color:#555;line-height:1.5}.source{margin-top:22px;padding:13px;background:#f7f7f7;border-radius:10px;font-size:13px;color:#555}
  </style>
</head>
<body>
<div class="card">
  <h1>Конвертор валют</h1>
  <div class="grid">
    <div><label>Сумма</label><input id="amount" type="number" min="0" step="0.01" value="100"></div>
    <div><label>Из валюты</label><select id="src">{% for c, name in currencies.items() %}<option value="{{c}}">{{c}} — {{name}}</option>{% endfor %}</select></div>
    <div><label>В валюту</label><select id="dst"><option value="USD">USD — Доллар США</option>{% for c, name in currencies.items() %}{% if c != 'USD' %}<option value="{{c}}">{{c}} — {{name}}</option>{% endif %}{% endfor %}</select></div>
    <div><label>Пользователь</label><input id="user" value="guest"></div>
  </div>
  <button onclick="convert()">Получить курс и конвертировать</button>
  <div id="result" class="result">Введите сумму и нажмите кнопку.</div>
  <div id="meta" class="meta"></div>
  <div class="source"><b>Источник курсов:</b> European Central Bank (ECB) через Frankfurter API.<br>
    Курсы являются справочными и обновляются по графику источника; приложение не предназначено для биржевой торговли.</div>
</div>
<script>
async function convert(){
  const resultBox=document.getElementById('result');
  const meta=document.getElementById('meta');
  resultBox.textContent='Получаем актуальный курс...';
  meta.textContent='';
  const body={amount:document.getElementById('amount').value,src:document.getElementById('src').value,dst:document.getElementById('dst').value};
  const user=document.getElementById('user').value;
  try {
    const r=await fetch('/convert?user='+encodeURIComponent(user),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const data=await r.json();
    if(!r.ok){ resultBox.textContent=data.error || 'Ошибка'; return; }
    resultBox.textContent=`${body.amount} ${data.src} = ${data.result} ${data.dst}`;
    meta.innerHTML=`Курс: 1 ${data.src} = ${data.rate} ${data.dst}<br>Дата курса: ${data.rate_date}<br>Источник: ${data.provider}`;
  } catch(e) {
    resultBox.textContent='Ошибка соединения с сервером.';
  }
}
</script>
</body>
</html>
